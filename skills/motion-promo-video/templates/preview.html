<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Promo — preview</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* Real-time preview with a scrubber. The clock (requestAnimationFrame) lives only here; the scene stays a pure function of t. */
  :root { --bg: #0d0f12; --panel: #16191e; --line: #262a31; --ink: #eef0f3; --muted: #9aa1ab; --accent: #c4f23a; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: grid; grid-template-rows: 1fr auto; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, sans-serif; }
  #wrap { display: grid; place-items: center; overflow: hidden; padding: 16px; }
  #frame { border: 0; transform-origin: center; border-radius: 10px; box-shadow: 0 30px 80px -30px #000; background: #fff; }
  #bar { display: flex; align-items: center; gap: 12px; padding: 12px 16px 14px; background: var(--panel); border-top: 1px solid var(--line); flex-wrap: wrap; }
  button, select { font: 600 13px/1 system-ui, sans-serif; color: var(--ink); background: #1f242b; border: 1px solid var(--line); border-radius: 999px; height: 36px; padding: 0 14px; cursor: pointer; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #play { min-width: 92px; background: var(--accent); color: #0a0a0a; border: 0; }
  #scrub { flex: 1; min-width: 200px; accent-color: var(--accent); cursor: pointer; }
  #time { font-variant-numeric: tabular-nums; min-width: 120px; text-align: right; color: var(--muted); }
  #marks { display: flex; gap: 6px; flex-wrap: wrap; }
  #marks button { height: 28px; font-size: 12px; }
</style>
</head>
<body>
<div id="wrap"><iframe id="frame" src="scene.html" title="Scene"></iframe></div>
<div id="bar">
  <button id="play" type="button">▶ Play</button>
  <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="Timeline position">
  <span id="time">0.00 / 0.00 s</span>
  <div id="marks" aria-label="Scenes"></div>
  <select id="lang" aria-label="Language"></select>
  <select id="speed" aria-label="Speed"><option value="1">1×</option><option value="0.5">0.5×</option><option value="0.25">0.25×</option></select>
  <button id="sound" type="button" title="Soundtrack is synthesized at render time">🔇 render for sound</button>
</div>
<script>
  const frame = document.getElementById("frame"), scrub = document.getElementById("scrub"), time = document.getElementById("time"), btn = document.getElementById("play");
  let D = 0, t = 0, playing = false, last = 0, size = { w: 1080, h: 1920 };
  function fit() {
    const w = document.getElementById("wrap"), s = Math.min((w.clientWidth - 32) / size.w, (w.clientHeight - 32) / size.h);
    frame.style.width = size.w + "px"; frame.style.height = size.h + "px";
    frame.style.transform = `scale(${s})`; frame.style.margin = `${(size.h * s - size.h) / 2}px ${(size.w * s - size.w) / 2}px`;
  }
  function go(x) { t = Math.max(0, Math.min(D, x)); frame.contentWindow.seek?.(t); scrub.value = D ? (t / D) * 1000 : 0; time.textContent = `${t.toFixed(2)} / ${D.toFixed(2)} s`; }
  function tick(now) {
    if (!playing) return;
    t += ((now - last) / 1000) * Number(document.getElementById("speed").value); last = now;
    if (t >= D) { t = D; playing = false; btn.textContent = "▶ Play"; }
    go(t); if (playing) requestAnimationFrame(tick);
  }
  function toggle() { playing = !playing; btn.textContent = playing ? "❚❚ Pause" : "▶ Play"; if (playing) { if (t >= D) t = 0; last = performance.now(); requestAnimationFrame(tick); } }
  frame.addEventListener("load", async () => {
    const w = frame.contentWindow;
    D = await w.READY; size = w.SIZE ?? size; fit();
    const marks = document.getElementById("marks"); marks.innerHTML = "";
    Object.entries(w.REVIEW ?? {}).sort((a, b) => a[1] - b[1]).forEach(([k, v]) => { const b = document.createElement("button"); b.type = "button"; b.textContent = k.replace(/^\d+-/, ""); b.onclick = () => go(v); marks.appendChild(b); });
    const langs = w.document.documentElement.lang; const sel = document.getElementById("lang");
    if (!sel.options.length) for (const l of ["pt-BR", "en", "es"]) { const o = document.createElement("option"); o.value = l; o.textContent = l; sel.appendChild(o); }
    sel.value = langs; go(t);
  });
  btn.addEventListener("click", toggle);
  scrub.addEventListener("input", () => { playing = false; btn.textContent = "▶ Play"; go((scrub.value / 1000) * D); });
  document.getElementById("lang").addEventListener("change", (e) => { frame.src = `scene.html?lang=${e.target.value}`; });
  addEventListener("keydown", (e) => {
    if (e.key === " ") { e.preventDefault(); toggle(); }
    if (e.key === "ArrowRight") go(t + (e.shiftKey ? 1 : 1 / 60));
    if (e.key === "ArrowLeft") go(t - (e.shiftKey ? 1 : 1 / 60));
  });
  addEventListener("resize", fit); fit();
</script>
</body>
</html>
